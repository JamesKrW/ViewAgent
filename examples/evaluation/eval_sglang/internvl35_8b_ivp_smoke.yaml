# Tiny IVP smoke: 2 envs — validate multi-turn IVP + remote render service
# (reached via with-proxy) end to end with the vLLM InternVL backend.
defaults:
  - ../eval_default

fileroot: ${oc.env:VIEWSUITE_ROOT}

default_chat_config:
  temperature: 0.0
  max_tokens: 2048
  top_p: 0.95

envs:
  - name: InteractiveViewPlanning
    n_envs: 2
    tag_id: interactive_view_planning
    seed: [1, 2, 1]
    split: test
    max_turns: 10
    config:
      jsonl_path: ${fileroot}/data/viewsuite_15k/interactive_view_planning_test.jsonl
      max_turns: 10
      render_backend: client
      client_url_file_path: ${fileroot}/client_url.txt
      image_size: [512, 512]
      format: eval_mode
      use_example_in_sys_prompt: false
      action_only_mode: true

experiment:
  dump_dir: ${fileroot}/rollouts/internvl35_8b_ivp_smoke
  default_max_turns: 10

run:
  backend: "vllm"
  base_seed: 0
  max_concurrent_jobs: 2
  resume: skip_completed
  live_summary: true

backends:
  vllm:
    base_url: "http://127.0.0.1:30011/v1"
    api_key: "EMPTY"
    model: "OpenGVLab/InternVL3_5-8B-HF"
    max_concurrency: 2
    max_retries: 6
    min_backoff: 0.5
    max_backoff: 8.0
