experiment:
  id: ${VAGEN_EXPERIMENT_ID}
  output_dir: ../../../runs/eval

run:
  base_seed: 0
  max_concurrent_episodes: 1
  resume: skip_completed
  record_images: true

defaults:
  max_turns: 5
  # Thinking is part of the baseline. Qwen3.5-4B frequently spends more than 2048
  # tokens before producing final content, so a lower ceiling measures truncation rather
  # than action quality.
  response_length_per_turn: 8192
  sampling:
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    chat_template_kwargs:
      enable_thinking: true

models:
  - name: ${VAGEN_MODEL_RUN_NAME}
    backend: openai
    served_model: ${VAGEN_SERVED_MODEL}
    base_url: ${VAGEN_MODEL_BASE_URL}
    api_key: ${VAGEN_MODEL_API_KEY}
    timeout: 600
    max_concurrency: 1
    max_retries: 2
    thinking_token_budget: 4096
    thinking_budget_field: thinking_token_budget
    thinking_answer_reserve: 512

envs:
  - name: Sokoban
    tag: sokoban-concat
    n_envs: 4
    seed_list: &seeds [10001, 10002, 10003, 10004]
    harness: concat
    config: &sokoban
      render_mode: vision
      prompt_format: answer
      strict_format: true
      format_reward: 0.0
      min_solution_steps: [1, 5]

  - name: Sokoban
    tag: sokoban-no-concat
    n_envs: 4
    seed_list: *seeds
    harness: no_concat
    config: *sokoban

  - name: Sokoban
    tag: sokoban-compact
    n_envs: 4
    seed_list: *seeds
    harness: compact
    harness_config:
      budget: 24000
      summary_budget: 1024
    config: *sokoban
