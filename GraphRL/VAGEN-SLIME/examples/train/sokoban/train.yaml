# max_turns is 5, the published setting and the one every run in this repo uses. The repo
# used to ship 20 here and rely on the cluster wrapper to normalise it, which left a
# standalone run with an episode that could not fit its response region:
#   20 x 512 + 19 x 320 = 16320   against  data.max_response_length=4000
# At 5 it is 5 x 512 + 4 x 320 = 3840 and the startup warning goes away for a real reason.
#
# The port uses VAGEN's base compact_budget=4000, under which this five-turn episode fits
# even at the configured ceilings. Compact is therefore concat-like on normal Sokoban
# trajectories and only summarises unusually long ones. VAGEN's 1200/300 compact ablation
# deliberately makes a different choice and forces compaction within five turns.
envs:
  - name: Sokoban # registered env name
    n_envs: 10000
    data_source: sokoban # nickname for logging
    seed: [1,10000,1] # sample n_env seeds from seed[0] to seed[1] with each seed repeat at most seed[2] times
    max_turns: 5 # max number of interaction turns per episode
    response_length_per_turn: 512 # max response length per turn
    # The largest one observation may be. InternVL3.5 expands the same continuation to
    # 278-292 tokens, while Qwen2.5-VL needs only 80-96. 320 covers both families without
    # letting a runaway observation eat the response region. Undeclared this falls back to
    # DEFAULT_MAX_ENV_RESPONSE=2048, which is not a bound on anything this env does
    # and makes the episode-size warning fire on every run until nobody reads it.
    # At max_turns=5, 5*512 + 4*320 = 3840, still inside the launchers' 4000-token
    # response region.
    max_env_response_per_turn: 320
    config: # env-specific config
      render_mode: vision
      prompt_format: free_think
      # 0.02 a turn, not the 0.1 default: at max_turns=5 the default pays 0.5 for
      # formatting alone, half of what solving the level is worth. 0.02 pays 0.10 over
      # the episode, matching what the two state rewards pay together.
      format_reward: 0.02
      min_solution_steps: [1,5]
