# Per-role Megatron overrides, read by slime's --megatron-config-path.
#
# Exists for exactly one setting: the critic's learning rate. VAGEN ships
# `critic.optim.lr=1e-5` against `actor.optim.lr=1e-6` (vagen/configs/baseline_vllm.flags)
# -- the critic learns ten times faster than the policy, which is the standard PPO setup
# and matters more than usual here: under `default_gae` the *entire* advantage is
# `R_total - V(s)`, so an underfit critic is not a slightly worse baseline, it is the whole
# signal being wrong.
#
# slime has no `--critic-lr`; a role-tagged Megatron config is the channel
# (same shape as examples/geo3k_vlm_multi_turn's PPO launcher). Without this the critic
# silently inherits the actor's 1e-6.
# The critic also needs `attention_backend`, and not for tuning: a role config is parsed
# from scratch, so anything the command line set and this file does not mention falls back
# to the argparse default -- `auto` for the attention backend. TE's `auto` then picks cuDNN
# fused attention, which on a box carrying both a cuda-12 and a cuda-13 libcudart in the
# ldconfig cache dies with "Multiple libcudart libraries found", inside the critic's first
# forward pass, after the rollout has already been paid for. The actor never sees it
# because the command line does set it there.
megatron:
  - name: default
    role: actor
    overrides:
      attention_backend: flash
  - name: default
    role: critic
    overrides:
      lr: 1.0e-5
      attention_backend: flash
