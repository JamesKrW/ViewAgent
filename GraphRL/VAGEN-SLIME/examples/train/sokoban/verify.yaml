# The held-out set cut to 32 episodes, for `run_sokoban.py --rollout-only`. Same
# configuration as val.yaml in every other respect, so a rollout checked here is the
# rollout that runs in evaluation.
# max_turns is 5, the published setting and the one every run in this repo uses. The repo
# used to ship 20 here and rely on the cluster wrapper to normalise it, which left a
# standalone run with an episode that could not fit its response region:
#   20 x 512 + 19 x 320 = 16320   against  data.max_response_length=4000
# At 5 it is 5 x 512 + 4 x 320 = 3840 and the startup warning goes away for a real reason.
#
# The port uses VAGEN's base compact_budget=4000, under which this five-turn episode fits
# even at the configured ceilings. Compact is therefore concat-like on normal Sokoban
# trajectories and only summarises unusually long ones. VAGEN's 1200/300 compact ablation
# deliberately makes a different choice and forces compaction within five turns.
envs:
  - name: Sokoban
    n_envs: 32
    data_source: sokoban
    seed: [10001,10032,1]
    max_turns: 5
    response_length_per_turn: 512
    # Match training: InternVL3.5 needs 278-292 tokens for a continuation, while
    # Qwen2.5-VL needs only 80-96. 320 covers both and keeps the five-turn worst case
    # inside the launchers' 4000-token response region.
    # Undeclared this falls back to
    # DEFAULT_MAX_ENV_RESPONSE=2048, which is not a bound on anything this env does
    # and makes the episode-size warning fire on every run until nobody reads it.
    max_env_response_per_turn: 320
    config:
      render_mode: vision
      prompt_format: free_think
      # Must match the train yaml. Absent, this falls back to SokobanEnvConfig's default
      # of 0.1 a turn -- so validation was scoring 1.0 + 5*0.1 = 1.50 for a solved episode
      # where training scored 1.0 + 5*0.02 = 1.10, and val reward stopped being comparable
      # to train reward at all. Worse, formatting was then worth 0.5 against 1.0 for
      # solving, so a run that never solved anything but wrote clean tags scored half a
      # success. tests/test_train_and_val_agree_on_rewards.py pins the two together.
      format_reward: 0.02
      min_solution_steps: [1,5]
