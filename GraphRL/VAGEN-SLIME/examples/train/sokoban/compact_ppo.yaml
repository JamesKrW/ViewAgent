# Where this run sits on each axis. Read by slime's --custom-config-path, which merges
# these keys onto the argument namespace, so anything here can be overridden on the
# command line like any other slime flag.
#
# The environment is NOT named here: it rides per-row in the dataset's `metadata`, so one
# run can mix families and adding one is a dataset change. See vagen_agent/make_dataset.py.

# ---- context policy ---------------------------------------------------------
# concat | no_concat | compact, or an import path to a custom BaseHarness.
harness: compact

# ---- algorithm --------------------------------------------------------------
# Maps to Slime flags through the vagen_agent.algorithms registry. `default_gae` resolves to
# slime's native `--advantage-estimator ppo` with no custom advantage function: at
# gamma = lam = 1 the per-row GAE reproduces VAGEN's episode-global default_gae token for
# token. That equivalence is asserted at startup (RunConfig._check_against) -- it does
# not survive gamma < 1 or lam < 1.
algorithm: default_gae

# ---- model / backend --------------------------------------------------------
# `auto` resolves from the tokenizer class and refuses rather than guessing wrong; naming
# the family explicitly is better when you know it.
model_adapter: qwen

# ---- defaults for anything a dataset row leaves unset ------------------------
default_max_turns: 5
default_response_length_per_turn: 512
default_max_env_response_per_turn: 320

# ---- compaction (only read when harness is compact) --------------------------
# Match VAGEN's base compact setting.  With five 512-token Sokoban turns this normally
# leaves the episode in one conversation (and therefore close to concat), while retaining
# compaction as a safety valve if a trajectory actually grows long.  VAGEN's dedicated
# compaction ablation uses 1200/300 specifically to force roughly one compaction per
# five-turn episode; that is a different experiment.
compact_budget: 4000
compact_summary_budget: 512
