experiment:
  id: ${VAGEN_EXPERIMENT_ID}
  output_dir: ../../../runs/eval

run:
  base_seed: 0
  max_concurrent_episodes: 8
  resume: skip_completed
  record_images: true

defaults:
  max_turns: 5
  response_length_per_turn: 4096
  sampling:
    temperature: 0.0

models:
  - name: ${VAGEN_MODEL_RUN_NAME}
    backend: openai
    served_model: ${VAGEN_SERVED_MODEL}
    base_url: ${VAGEN_MODEL_BASE_URL}
    api_key: ${VAGEN_MODEL_API_KEY}
    timeout: 600
    max_concurrency: 8
    max_retries: 4
    # Change to max_completion_tokens when required by the provider/model.
    token_limit_field: max_tokens

envs:
  - name: Sokoban
    tag: sokoban-no-concat
    n_envs: 4
    seed_list: [10001, 10002, 10003, 10004]
    harness: no_concat
    config:
      render_mode: vision
      prompt_format: answer
      strict_format: true
      format_reward: 0.0
      min_solution_steps: [1, 5]
