# =============================================================================
# ViewSuite Interactive View Planning — GraphRL Pipeline Config (Qwen3-VL-8B)
# =============================================================================
# Mirrors pipeline_v2.yaml exactly, except:
#   - initial_model_path swapped to Qwen/Qwen3-VL-8B-Instruct
#   - SFT template swapped to qwen3_vl_nothink (LLaMA-Factory Qwen3-VL template)
#   - experiment_dir / experiment_name updated
#
# Usage:
#   bash run_qwen3vl8b.sh
#   bash run_qwen3vl8b.sh experiment_dir=/my/exp iterations=5

hydra:
  job:
    chdir: false

project_name: viewsuite
experiment_name: viewsuite_interactive_view_planning_qwen3vl8b
experiment_dir: exps/${project_name}/${experiment_name}
initial_model_path: Qwen/Qwen3-VL-8B-Instruct
iterations: 3

general_overrides:
  rl:
    training_steps: 600
    slime:
      train_envs: null
      eval_envs: null
      harness: concat
      algorithm: default_gae
      rollout_max_prompt_len: 4000
      rollout_max_response_len: 10000
      rollout_batch_size: 128
      n_samples_per_prompt: 1
      num_gpus: 8
      rollout_tensor_parallel_size: 1
      sglang_mem_fraction_static: 0.6
      sglang_attention_backend: flashinfer
      sglang_mm_attention_backend: triton_attn
      eval_interval: 20
      save_interval: 20

  traj_to_sft:
    module: graphrl.envs.viewsuite.viewsuite_interactive_view_planning.InteractiveViewPlanningTrajToSFT
    viewsuite_15k_dir: ${oc.env:VIEWSUITE_ROOT}/data/viewagent15k_scannet_open3d
    graph_builder:
      num_workers: 4
      filter:
        void_threshold: 0.7
        std_threshold: 10.0
    generators:
      - action_gen
      - path_to_view
      - multi_turn_action_gen
      - multi_turn_action_gen_mcq
      - multi_turn_action_gen_mix
      - view_difference
      - view_difference_mcq
    action_gen:
      min_path_len: 1
      max_path_len: 3
      sample_per_scene: 15
      balanced_sampling: true
    path_to_view:
      min_path_len: 1
      max_path_len: 3
      sample_per_scene: 15
      balanced_sampling: true
    multi_turn_action_gen:
      min_path_len: 3
      max_path_len: 5
      sample_per_scene: 20
      oversample: 10
      single_mix_multi_ratio: "6:2:2"
      balanced_sampling: true
    multi_turn_action_gen_mcq:
      min_path_len: 1
      max_path_len: 3
      sample_per_scene: 15
      balanced_sampling: false
    multi_turn_action_gen_mix:
      min_path_len: 3
      max_path_len: 5
      sample_per_scene: 20
      mcq_prob: 0.5
      balanced_sampling: true
    view_difference:
      min_path_len: 2
      max_path_len: 5
      sample_per_scene: 15
      balanced_sampling: true
    view_difference_mcq:
      min_path_len: 2
      max_path_len: 5
      sample_per_scene: 15
      balanced_sampling: true
    seed: 42

  sft:
    n_gpus: 8
    hydra_overrides:
      stage: sft
      do_train: true
      finetuning_type: full
      dataset: multi_turn_action_gen,view_difference,view_difference_mcq
      template: qwen3_vl_nothink  # multimodal Qwen3-VL template (non-thinking)
      cutoff_len: 16384           # multi_turn_action_gen can be long with images
      preprocessing_num_workers: 16
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 2
      learning_rate: 1.0e-5
      num_train_epochs: 4.0
      weight_decay: 0.01
      lr_scheduler_type: cosine
      warmup_ratio: 0.1
      bf16: true
      flash_attn: fa2                  # Flash Attention 2 for long sequences
      logging_steps: 10
      overwrite_output_dir: true
      # --- Validation ---
      val_size: 0.2                    # 20% of training data as validation
      eval_strategy: epoch             # evaluate at each epoch boundary
      per_device_eval_batch_size: 2
      load_best_model_at_end: true     # keep the checkpoint with lowest eval_loss
      metric_for_best_model: eval_loss
      greater_is_better: false
      save_strategy: epoch             # must match eval_strategy for load_best_model_at_end
      save_total_limit: 1              # keep only the best checkpoint
      trust_remote_code: true
      deepspeed: ds_z2_config.json
      use_fast_tokenizer: false

iteration_overrides:
  iter0:
    rl:
      training_steps: 61
    sft:
      hydra_overrides:
        num_train_epochs: 3.0
  iter1:
    rl:
      training_steps: 61
    sft:
      hydra_overrides:
        num_train_epochs: 3.0
  iter2:
    rl:
      training_steps: 61
    sft:
      hydra_overrides:
        num_train_epochs: 3.0
  iter3:
    rl:
      training_steps: 1001
      timeout: 259200  # 72h — long-horizon iter, default 24h is not enough
