envs:
  - name: InteractiveViewPlanning
    data_source: ae
    seed: [0, 377, 1]
    n_envs: 378
    max_turns: 10
    response_length_per_turn: 512
    config:
      jsonl_path: ${oc.env:VIEWSUITE_ROOT}/data/viewagent15k_scannet_open3d/interactive_view_planning_dev.jsonl
      image_size: [256, 256]
      format: eval_mode
      use_example_in_sys_prompt: false
      client_url_file_path: ${oc.env:VIEWSUITE_ROOT}/client_url.txt
      render_backend: client
      max_turns: 10
      action_only_mode: true
      allow_rotate: false
      ground_plane_movement: false
      # Per-turn bonus when the model emits the reasoning format
      # `<observation>...</observation> ... <action>...</action>`.
      obs_format_bonus_reward: 0.01

# ★ path_to_view and view_to_path are commented out, not deleted.
#
# Nothing trains on them -- the train split is IVP only -- so they were paying
# two thirds of every validation to measure a policy no gradient ever reached.
# Validation runs at test_freq (every 20 steps), so that is the dominant fixed
# cost after rollout.
#
# Nothing downstream reads their metrics either: the adaptive controller keys on
# val-aux/ae/traj_success/mean@1, and no pipeline references the other two.
#
