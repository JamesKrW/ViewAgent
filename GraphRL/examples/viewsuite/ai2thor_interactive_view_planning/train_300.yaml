# AI2-THOR IVP 300x300 resolution ablation.
envs:
  - name: Ai2ThorInteractiveViewPlanning
    data_source: ae
    seed: [0, 1235, 1]
    n_envs: 1236
    max_turns: 10
    response_length_per_turn: 512
    config:
      jsonl_path: ${oc.env:VIEWSUITE_ROOT}/data/viewagent15k_ai2thor/interactive_view_planning_train.jsonl
      image_size: [300, 300]
      format: eval_mode
      use_example_in_sys_prompt: false
      client_url_file_path: ${oc.env:VIEWSUITE_ROOT}/client_url_ai2thor.txt
      render_backend: client
      max_turns: 10
      per_turn_format_reward: 0.01
      format_reward: 0.0
      give_answer_reward: 0.1
      action_only_mode: true
      allow_rotate: false
      ground_plane_movement: false
      obs_format_bonus_reward: 0.01
