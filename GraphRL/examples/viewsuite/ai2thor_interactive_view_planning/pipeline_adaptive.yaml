defaults:
  - pipeline
  - _self_

experiment_name: ai2thor_ivp_relative_earlystop

iterations: null
iteration_overrides: null

general_overrides:
  rl:
    training_steps: null
    timeout: 259200
  traj_to_sft:
    module: graphrl.adaptive.viewsuite_traj_to_sft.AdaptiveInteractiveViewPlanningTrajToSFT
  sft:
    hydra_overrides:
      num_train_epochs: 3.0

adaptive_round_overrides: {}

adaptive_schedule:
  metric: val-aux/ae/traj_success/mean@1
  direction: maximize
  eval_every_steps: 20
  min_delta: 0.03
  min_relative_delta: 0.10
  sft_patience: 3
  latch_threshold: 0.1
  finish_patience: 8
  total_rl_steps: 801
