# RL train envs for Habitat-GS Interactive View Planning (IVP).
# Scene-disjoint train split produced by split_jsonl_by_scene.
# Requires the Habitat-GS HTTP render service (client_url_habitat_gs.txt).
envs:
  - name: HabitatGSInteractiveViewPlanning
    data_source: ae
    seed: [0, 1182, 1]
    n_envs: 1183
    max_turns: 10
    response_length_per_turn: 512
    config:
      jsonl_path: ${oc.env:VIEWSUITE_ROOT}/data/viewagent15k_habitat_gs/interactive_view_planning_train.jsonl
      image_size: [256, 256]
      format: eval_mode
      use_example_in_sys_prompt: false
      client_url_file_path: ${oc.env:VIEWSUITE_ROOT}/client_url_habitat_gs.txt
      render_backend: client
      max_turns: 10
      per_turn_format_reward: 0.01
      format_reward: 0.0
      give_answer_reward: 0.1
      action_only_mode: true
      allow_rotate: false
      ground_plane_movement: false
      # Per-turn bonus when the model emits the reasoning format
      # `<observation>...</observation> ... <action>...</action>`.
      obs_format_bonus_reward: 0.01
