# =============================================================================
# Habitat-GS Interactive View Planning — GraphRL Pipeline Config
# =============================================================================
# Mirror of examples/viewsuite/viewsuite_interactive_view_planning/pipeline.yaml
# (ScanNet) but pointed at the Habitat-GS env classes + generated dataset.
#
# Usage:
#   bash run.sh                    # full iterative RL<->SFT
#   bash run_smoke.sh              # short RL-only smoke (proves the pipeline)
#
# Requires: VIEWSUITE_ROOT exported, the Habitat-GS HTTP render service running,
# and its URL written to $VIEWSUITE_ROOT/client_url_habitat_gs.txt.

hydra:
  job:
    chdir: false

project_name: viewagent
experiment_name: habitat_gs_interactive_view_planning
experiment_dir: exps/${project_name}/${experiment_name}
initial_model_path: Qwen/Qwen2.5-VL-7B-Instruct
iterations: 3

general_overrides:
  rl:
    training_steps: 600
    # VAGEN/verl backend. Only what this experiment varies is set here: the flags
    # that make a run work at all live in VAGEN's own
    # vagen/configs/baseline_vllm.flags, which the command builder reads directly
    # so the two cannot drift, and GraphRL's own defaults live in
    # graphrl/configs/vagen_configs/config.yaml. Restating either here would turn
    # a backend upgrade into a silent no-op.
    #
    # Colocated by construction: verl's hybrid engine puts actor, critic and
    # rollout on the same 8 GPUs (actor_rollout_ref.hybrid_engine is VAGEN's
    # default), so there is no disjoint-placement knob to set.
    #
    # train_files / val_files are injected by run.sh (they need absolute paths).
    hydra_overrides:
      data:
        max_prompt_length: 4000
        max_response_length: 10000
        train_batch_size: 128
        train_files: null
        val_files: null
      algorithm:
        # PPO with a critic, credited per token rather than per row. `gae` is
        # wrong here for the same reason VAGEN overrides it to `default_gae`:
        # verl's own estimators open each row with nextvalues=0, which is right
        # when a row is an episode and wrong when concat makes a row one turn.
        adv_estimator: token_level_gae
      actor_rollout_ref:
        actor:
          ppo_mini_batch_size: 128
          # Micro batch sizes are left to VAGEN's baseline_vllm.flags (all 1).
          checkpoint:
            # CheckpointMonitor promotes <ckpt>/actor/huggingface into rl_model/,
            # and that directory only exists when hf_model is among the contents.
            save_contents: [model, hf_model, optimizer, extra]
        rollout:
          n: 1
          tensor_model_parallel_size: 1
          # The value this experiment originally ran under. It is only affordable
          # because the memory saver is on (see vagen_configs/config.yaml):
          # sglang hands the reservation back for the training phase, so it is not
          # subtracted from the actor+critic budget.
          gpu_memory_utilization: 0.6
          max_num_batched_tokens: 32768
          enforce_eager: true
          # ★ The rest of the original rollout block, restored together with the
          # memory saver. Enabling the saver without these is what produced the
          # KeyError: 'weights' that was previously read as the saver being broken.
          mode: async
          engine_kwargs:
            sglang:
              # The original block named flashinfer. It cannot be used here: the
              # packaged conda env ships no CUDA headers, so flashinfer's JIT dies
              # compiling its prefill kernel --
              #   cutlass/util/reference/device/tensor_fill.h:52:10:
              #   fatal error: curand_kernel.h: No such file or directory
              # taking the sglang scheduler with it. triton needs no nvcc at run
              # time and matches the mm backend already in use. Nothing about the
              # memory saver depends on this choice.
              attention_backend: triton
              mm_attention_backend: triton_attn
      critic:
        # Deliberately not in baseline_vllm.flags: `need_critic` short-circuits on
        # it, so setting it there would build and train a critic for the GRPO
        # scripts too. A PPO experiment sets it itself.
        enable: true
      trainer:
        harness: concat
        n_gpus_per_node: 8
        nnodes: 1
        save_freq: 20
        test_freq: 20
        log_val_generations: 32

  traj_to_sft:
    module: graphrl.envs.viewsuite.viewsuite_interactive_view_planning.InteractiveViewPlanningTrajToSFT
    # NOTE: the SFT view-graph distillation generators read per-scene images from
    # this dir. For Habitat-GS this points at the generated dataset root; the full
    # distillation path may need per-generator path adaptation (the RL-only smoke
    # does not exercise it).
    viewsuite_15k_dir: ${oc.env:VIEWSUITE_ROOT}/data/habitat_gs
    graph_builder:
      num_workers: 4
      filter:
        void_threshold: 0.7
        std_threshold: 10.0
      atomize:                 # render intermediate views -> 100% single-action graph
        # ON by default. Without it the builder collapses multi-action turns back
        # into "a | b | c" edges, and the SFT data then teaches the model to emit a
        # whole open-loop plan in one turn -- measured on this corpus: ~60% of
        # episodes answered after a single reply, never looking at an intermediate
        # frame, and ending up further from the target than not moving at all.
        enabled: true
        corpus: habitat_gs
        client_url: null       # null -> $VIEWSUITE_ROOT/client_url_habitat_gs.txt
        corpus_dir: ${oc.env:VIEWSUITE_ROOT}/data/habitat_gs
        step_translation: 0.5
        # Habitat-GS scales the step per scene (0.25-8 m); corpus_dir supplies the
        # real value per scene and this global is only the fallback.
        step_rotation: 30.0
        size: 256
        render_chunk: 32
        max_scene_concurrency: 8
    generators:
      - action_gen
      - path_to_view
      - multi_turn_action_gen
      - multi_turn_action_gen_mcq
      - multi_turn_action_gen_mix
      - view_difference
      - view_difference_mcq
    action_gen:
      min_path_len: 1
      max_path_len: 3
      sample_per_scene: 15
      balanced_sampling: true
    path_to_view:
      min_path_len: 1
      max_path_len: 3
      sample_per_scene: 15
      balanced_sampling: true
    multi_turn_action_gen:
      min_path_len: 3
      max_path_len: 5
      sample_per_scene: 20
      oversample: 10
      single_mix_multi_ratio: "6:2:2"
      balanced_sampling: true
    multi_turn_action_gen_mcq:
      min_path_len: 1
      max_path_len: 3
      sample_per_scene: 15
      balanced_sampling: false
    multi_turn_action_gen_mix:
      min_path_len: 3
      max_path_len: 5
      sample_per_scene: 20
      mcq_prob: 0.5
      balanced_sampling: true
    view_difference:
      min_path_len: 2
      max_path_len: 5
      sample_per_scene: 15
      balanced_sampling: true
    view_difference_mcq:
      min_path_len: 2
      max_path_len: 5
      sample_per_scene: 15
      balanced_sampling: true
    seed: 42

  sft:
    n_gpus: 8
    hydra_overrides:
      stage: sft
      do_train: true
      finetuning_type: full
      dataset: action_gen,path_to_view,multi_turn_action_gen,multi_turn_action_gen_mcq,multi_turn_action_gen_mix,view_difference,view_difference_mcq
      template: qwen2_vl
      cutoff_len: 16384
      preprocessing_num_workers: 16
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 2
      learning_rate: 1.0e-5
      num_train_epochs: 4.0
      weight_decay: 0.01
      lr_scheduler_type: cosine
      warmup_ratio: 0.1
      bf16: true
      flash_attn: fa2
      logging_steps: 10
      overwrite_output_dir: true
      val_size: 0.2
      eval_strategy: epoch
      per_device_eval_batch_size: 2
      load_best_model_at_end: true
      metric_for_best_model: eval_loss
      greater_is_better: false
      save_strategy: epoch
      save_total_limit: 1
      trust_remote_code: true
      deepspeed: ds_z2_config.json
      use_fast_tokenizer: false

iteration_overrides:
  iter0:
    rl:
      training_steps: 65
    sft:
      hydra_overrides:
        num_train_epochs: 3.0
  iter1:
    rl:
      training_steps: 65
    sft:
      hydra_overrides:
        num_train_epochs: 3.0
  iter2:
    rl:
      training_steps: 65
    sft:
      hydra_overrides:
        num_train_epochs: 3.0
  iter3:
    rl:
      training_steps: 1001
      timeout: 259200
