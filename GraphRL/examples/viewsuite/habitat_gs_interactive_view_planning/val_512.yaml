# Validation envs for Habitat-GS IVP training.
envs:
  - name: HabitatGSInteractiveViewPlanning
    data_source: ae
    seed: [0, 203, 1]
    n_envs: 204
    max_turns: 10
    response_length_per_turn: 512
    config:
      jsonl_path: ${oc.env:VIEWSUITE_ROOT}/data/habitat_gs/interactive_view_planning_eval.jsonl
      image_size: [512, 512]
      format: eval_mode
      use_example_in_sys_prompt: false
      client_url_file_path: ${oc.env:VIEWSUITE_ROOT}/client_url_habitat_gs.txt
      render_backend: client
      max_turns: 10
      action_only_mode: true
      allow_rotate: false
      ground_plane_movement: false
      obs_format_bonus_reward: 0.01
