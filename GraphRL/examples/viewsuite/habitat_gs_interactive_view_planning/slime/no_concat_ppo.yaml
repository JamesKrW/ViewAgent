# Habitat-GS observations repeat the target, reference, and complete explored path each
# turn, so this task is intentionally no-concat. The environment name still rides in each
# dataset row and is not duplicated here.
harness: no_concat
algorithm: default_gae
model_adapter: qwen

default_max_turns: 10
default_response_length_per_turn: 512
# At the last turn an observation can contain 12+ 512px frames. This is a truncation
# ceiling after visual-token expansion, not a target length.
default_max_env_response_per_turn: 8192
