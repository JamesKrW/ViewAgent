# =============================================================================
# ViewSuite Interactive View Planning — Self-Bootstrapping Baseline Pipeline Config
# =============================================================================
#
# Difference from the graph-based pipeline:
#   - env_module points to the selfboot env package
#   - graph_builder / sft generator use "viewsuite_interactive_view_planning_selfboot"
#   - SFT trains on selfboot_multi_turn (filtered high-reward RL trajectories)
#     instead of graph-sampled datasets
#
# Usage:
#   bash run.sh
#   bash run.sh experiment_dir=/my/exp iterations=5

hydra:
  job:
    chdir: false

project_name: viewsuite
experiment_name: viewsuite_interactive_view_planning_selfboot
experiment_dir: exps/${project_name}/${experiment_name}
initial_model_path: Qwen/Qwen2.5-VL-7B-Instruct
iterations: 3

general_overrides:
  rl:
    training_steps: 600
    slime:
      train_envs: null
      eval_envs: null
      harness: concat
      algorithm: default_gae
      rollout_max_prompt_len: 4000
      rollout_max_response_len: 10000
      rollout_batch_size: 128
      n_samples_per_prompt: 1
      num_gpus: 8
      rollout_tensor_parallel_size: 1
      sglang_mem_fraction_static: 0.6
      sglang_attention_backend: flashinfer
      sglang_mm_attention_backend: triton_attn
      eval_interval: 20
      save_interval: 20

  traj_to_sft:
    module: graphrl.envs.viewsuite.viewsuite_interactive_view_planning_selfboot.SelfBootTrajToSFT
    reward_threshold: 0.5

  sft:
    n_gpus: 8
    hydra_overrides:
      stage: sft
      do_train: true
      finetuning_type: full
      dataset: selfboot_multi_turn
      template: qwen2_vl
      cutoff_len: 16384
      preprocessing_num_workers: 16
      per_device_train_batch_size: 2
      gradient_accumulation_steps: 2
      learning_rate: 1.0e-5
      num_train_epochs: 4.0
      weight_decay: 0.01
      lr_scheduler_type: cosine
      warmup_ratio: 0.1
      bf16: true
      flash_attn: fa2
      logging_steps: 10
      overwrite_output_dir: true
      val_size: 0.2
      eval_strategy: epoch
      per_device_eval_batch_size: 2
      load_best_model_at_end: true
      metric_for_best_model: eval_loss
      greater_is_better: false
      save_strategy: epoch
      save_total_limit: 5
      trust_remote_code: true
      deepspeed: ds_z2_config.json
      use_fast_tokenizer: false

iteration_overrides:
  iter0:
    rl:
      training_steps: 61
    sft:
      hydra_overrides:
        num_train_epochs: 3.0
  iter1:
    rl:
      training_steps: 61
    sft:
      hydra_overrides:
        num_train_epochs: 3.0
  iter2:
    rl:
      training_steps: 61
    sft:
      hydra_overrides:
        num_train_epochs: 3.0
  iter3:
    rl:
      training_steps: 1000
      timeout: 259200  # 72h — long-horizon iter, default 24h is not enough
